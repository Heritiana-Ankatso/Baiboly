# Push a tag such as v1.2.0: build, test, sign with the permanent key and
# publish a GitHub Release with the APK attached.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   BAIBOLY_KEYSTORE_BASE64   the release keystore (.p12), base64-encoded
#   BAIBOLY_KEYSTORE_PASSWORD
#   BAIBOLY_KEY_ALIAS         baiboly
#   BAIBOLY_KEY_PASSWORD
# The key is never stored in the repository.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the data build
        run: pip install -r tools/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          # the action's default ("tools") no longer exists in the SDK manager
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the app version
        run: |
          want="v$(grep '^baiboly.versionName=' gradle.properties | cut -d= -f2)"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but gradle.properties says $want"; exit 1; }
      - name: Bible data (licence-checked sources)
        run: python3 tools/build_data.py
      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BAIBOLY_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing secret BAIBOLY_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baiboly-release.p12"
          echo "BAIBOLY_KEYSTORE=$RUNNER_TEMP/baiboly-release.p12" >> "$GITHUB_ENV"
      - name: Signed release build
        env:
          BAIBOLY_KEYSTORE_PASSWORD: ${{ secrets.BAIBOLY_KEYSTORE_PASSWORD }}
          BAIBOLY_KEY_ALIAS: ${{ secrets.BAIBOLY_KEY_ALIAS }}
          BAIBOLY_KEY_PASSWORD: ${{ secrets.BAIBOLY_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "Baiboly-${GITHUB_REF_NAME}.apk"
          # refuse to publish an APK not signed with the release key
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "Baiboly-${GITHUB_REF_NAME}.apk" | tee certs.txt
          ! grep -q "CN=Android Debug" certs.txt
          sha256sum "Baiboly-${GITHUB_REF_NAME}.apk" > "Baiboly-${GITHUB_REF_NAME}.apk.sha256"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/baiboly-release.p12"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Baiboly ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            Baiboly-${{ github.ref_name }}.apk
            Baiboly-${{ github.ref_name }}.apk.sha256
