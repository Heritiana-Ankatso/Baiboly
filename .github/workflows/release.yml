# Push a tag such as v1.2.0, or press "Run workflow" (Actions > Release) to
# release the version in gradle.properties from main: build, test, sign with
# the permanent key and publish a GitHub Release (and its tag) with the APK.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   BAIBOLY_KEYSTORE_BASE64   the release keystore (.p12), base64-encoded
#   BAIBOLY_KEYSTORE_PASSWORD
#   BAIBOLY_KEY_ALIAS         baiboly
#   BAIBOLY_KEY_PASSWORD
# The key is never stored in the repository.
#
# Optional downloads (the other Bibles, Hebrew and Greek, commentaries) are
# not in the APK: they are release assets of a pre-release tagged
# data-<PACK_VERSION> (tools/packs.py). If that data release exists, this
# build uses exactly its files (and the tests run on them); otherwise it is
# published here, as a pre-release so that phones never take it for an app
# update, before the app release. Never delete a data release: older
# versions of the app download from it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the data build
        run: pip install -r tools/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          # the action's default ("tools") no longer exists in the SDK manager
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version to release
        run: |
          want="v$(grep '^baiboly.versionName=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # a pushed tag must match the app version
            [ "$want" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but gradle.properties says $want"; exit 1; }
          else
            # run by hand: only from main, and never over an existing tag
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "Run the release from main"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$want" >/dev/null; then echo "$want is already released"; exit 1; fi
          fi
          echo "TAG=$want" >> "$GITHUB_ENV"
      - name: Bible data (licence-checked sources)
        run: python3 tools/build_data.py
      - name: Optional downloads (use the published data release, or publish it below)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 tools/packs.py tag)"
          echo "DATA_TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # already published: the APK's packs.json and the tests use exactly those files
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build/published --clobber
            python3 tools/packs.py adopt build/published
          else
            echo "No $tag yet: it is published with this release"
            echo "PUBLISH_DATA=1" >> "$GITHUB_ENV"
          fi
      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BAIBOLY_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing secret BAIBOLY_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baiboly-release.p12"
          echo "BAIBOLY_KEYSTORE=$RUNNER_TEMP/baiboly-release.p12" >> "$GITHUB_ENV"
      - name: Signed release build
        env:
          BAIBOLY_KEYSTORE_PASSWORD: ${{ secrets.BAIBOLY_KEYSTORE_PASSWORD }}
          BAIBOLY_KEY_ALIAS: ${{ secrets.BAIBOLY_KEY_ALIAS }}
          BAIBOLY_KEY_PASSWORD: ${{ secrets.BAIBOLY_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "Baiboly-${TAG}.apk"
          # refuse to publish an APK that is unsigned or not signed with the release key
          # (the runner has several build-tools versions: use the newest apksigner)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "Baiboly-${TAG}.apk" > certs.txt
          cat certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "Signed with the debug key: check the four secrets"; exit 1; fi
          grep -q "CN=Baiboly" certs.txt || { echo "Not signed with the Baiboly release key"; exit 1; }
          sha256sum "Baiboly-${TAG}.apk" > "Baiboly-${TAG}.apk.sha256"
          # the optional downloads must not be inside the release APK
          if unzip -l "Baiboly-${TAG}.apk" | grep -E 'assets/databases/(text-|commentary-|original\.db)'; then
            echo "The release APK carries optional downloads"; exit 1
          fi
          unzip -l "Baiboly-${TAG}.apk" | grep -q 'assets/databases/packs.json' || { echo "packs.json missing from the APK"; exit 1; }
          ls -l "Baiboly-${TAG}.apk"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/baiboly-release.p12"
      - name: Publish the data release (only the first time for this data set)
        if: env.PUBLISH_DATA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DATA_TAG" build/packs/*.gz build/packs/packs.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Baiboly data ${DATA_TAG#data-}" --notes-file docs/data-release.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Baiboly ${{ env.TAG }}
          body_path: docs/release-notes.md
          files: |
            Baiboly-${{ env.TAG }}.apk
            Baiboly-${{ env.TAG }}.apk.sha256
