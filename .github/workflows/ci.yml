# Every push and pull request: data pipeline, silence check, all tests, debug build.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the data build
        run: pip install -r tools/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          # the action's default ("tools") no longer exists in the SDK manager
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bible data (licence-checked sources)
        run: python3 tools/build_data.py
      - name: Silence check
        run: bash tools/check_silence.sh
      - name: Optional downloads stay out of the release assets
        run: |
          # bible.db, study.db and library.db only in src/main; the packs in src/debug and build/packs
          if ls app/src/main/assets/databases | grep -E '^(text-|commentary-|original\.db)'; then exit 1; fi
          python3 -c "import json; m=json.load(open('app/src/main/assets/databases/manifest.json')); p=json.load(open('app/src/main/assets/databases/packs.json')); assert sorted(m['files'])==['bible.db','library.db','study.db'], m; assert len(p['packs'])>0 and all(x['url'].startswith('https://') for x in p['packs'])"
      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            core/build/reports/tests
